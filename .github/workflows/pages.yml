name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild the site payload from the source of truth
        run: python3 build.py

      - name: Stage the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r site/* _site/
          cp -r data _site/data
          cp README.md _site/README.md
          cp LICENSE _site/LICENSE
          cp LICENSE-data _site/LICENSE-data
          cp .nojekyll _site/.nojekyll
          # a root index.html already exists in site/; add data.js alongside it
          ls -la _site _site/data

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
